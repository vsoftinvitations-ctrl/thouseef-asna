  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* hero */
    #hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      background: radial-gradient(ellipse at 50% 40%, #fdfaf3 0%, var(--ivory) 70%)
    }

    #hero::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid var(--gold-soft);
      pointer-events: none
    }

    #hero::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(184, 152, 90, .25);
      pointer-events: none
    }

    .mono {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .2em;
      color: var(--gold);
      margin-bottom: 34px;
      padding-left: .2em
    }

    .date {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .14em;
      margin-top: 34px
    }

    .day {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 2px
    }

    .tag {
      margin: 28px 0 38px;
      color: var(--mute);
      font-size: .9rem
    }

    .btn {
      display: inline-block;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 14px 34px;
      font: 400 .72rem var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: transform .35s ease, background .35s ease, border-color .35s ease
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.03);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }

    #hero {
      position: fixed;
      inset: 0;
      z-index: 20;
      transition: opacity .9s ease, visibility .9s
    }

    #hero.leaving {
      opacity: 0;
      visibility: hidden
    }

    .arch {
      width: min(34vw, 160px, calc(22svh*.75));
      aspect-ratio: 3/4;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 6px 6px;
      padding: 5px;
      margin-bottom: clamp(18px, 4svh, 32px)
    }

    .arch img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 34%;
      border-radius: 999px 999px 3px 3px
    }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gal {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 26%;
      text-align: left
    }

    .ph {
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(60, 50, 30, .12);
      background: var(--cream)
    }

    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
      transition: transform 2.6s ease
    }

    .in.ph img,
    .in .ph img {
      transform: none
    }

    .ga {
      width: 80%;
      aspect-ratio: 4/5
    }

    .ga img {
      object-position: 50% 28%
    }

    .gb {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 54%;
      aspect-ratio: 3/4;
      border: 6px solid var(--ivory)
    }

    .gb img {
      object-position: 50% 36%
    }

    @media(prefers-reduced-motion:reduce) {
      .ph img {
        transition: none;
        transform: none
      }
    }

    /* hero sequence */
    .seq {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      animation: seq .6s ease forwards;
      animation-delay: calc(var(--i)*.16s + .05s)
    }

    @keyframes seq {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* reveal */
    .r {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease
    }

    .r.in {
      opacity: 1;
      transform: none
    }

    .line-x {
      transform: scaleX(0);
      transition: transform 1.1s ease
    }

    .in .line-x,
    .line-x.in {
      transform: scaleX(1)
    }

    /* date */
    .daynum {
      font-family: var(--serif);
      font-size: clamp(6rem, 30vw, 10rem);
      line-height: .9;
      font-weight: 300;
      color: var(--ink)
    }

    .month {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      margin-top: 8px;
      padding-left: .3em
    }

    .time {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin-top: 8px
    }

    .pin {
      width: 22px;
      height: 22px;
      color: var(--gold);
      margin-bottom: 18px
    }

    .note {
      font-family: var(--serif);
      font-style: italic;
      color: var(--mute);
      font-size: 1.15rem;
      margin-top: 22px
    }

    /* families */
    .fam {
      display: grid;
      gap: 56px;
      max-width: 860px;
      margin: 56px auto 0
    }

    .fam h3 {
      font-size: 1.6rem;
      line-height: 1.3;
      margin: 0 0 14px
    }

    .fam .label {
      margin-bottom: 18px
    }

    .fam p {
      margin: 0;
      color: var(--mute);
      font-size: .95rem
    }

    .fam .sep {
      width: 1px;
      height: 56px;
      background: var(--gold-soft);
      margin: 0 auto;
      display: none
    }

    @media(min-width:760px) {
      .fam {
        grid-template-columns: 1fr 1px 1fr;
        gap: 48px;
        align-items: start
      }

      .fam .sep {
        display: block;
        height: 100%;
        min-height: 200px
      }
    }

    .comp {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 4.3vw, 1.35rem);
      line-height: 1.9
    }

    .comp span {
      padding: 0 clamp(10px, 3vw, 20px);
      white-space: nowrap
    }

    .comp span+span {
      border-left: 1px solid var(--gold-soft)
    }

    .foot {
      padding: 48px 24px 56px;
      text-align: center;
      border-top: 1px solid var(--gold-soft)
    }

    .foot .serif {
      font-size: 1.4rem;
      letter-spacing: .2em
    }

    @media(prefers-reduced-motion:reduce) {

      .seq,
      .r,
      .line-x {
        animation: none;
        transition: none;
        opacity: 1;
        transform: none
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      document.getElementById('hero').classList.add('leaving');
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
    }
    document.querySelector('#hero .btn').addEventListener('click', e => { e.preventDefault(); openInvite() });

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');

    function playAudio() {
      if (!audio) return;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>

</html>
